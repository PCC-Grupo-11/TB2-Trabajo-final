name: Publish docker images

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - "frontend/**"

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  amd64:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        app: [api, inference]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push (amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.app }}

          push: true
          platforms: linux/amd64

          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.app }}:${{ github.ref_name == 'main' && 'stable' || 'latest' }}
            ghcr.io/${{ github.repository }}/${{ matrix.app }}:${{ github.sha }}

          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/${{ matrix.app }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}/${{ matrix.app }}:buildcache,mode=max


  arm64:
    runs-on: ubuntu-22.04-arm
    strategy:
      fail-fast: false
      matrix:
        app: [api, inference]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push (arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.app }}

          push: true
          platforms: linux/arm64

          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.app }}:${{ github.ref_name == 'main' && 'stable' || 'latest' }}
            ghcr.io/${{ github.repository }}/${{ matrix.app }}:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/${{ matrix.app }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}/${{ matrix.app }}:buildcache,mode=max
