name: Publish docker images

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - "frontend/**"

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  amd64:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        app: [api, inference]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repo
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Short SHA
        id: vars
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push (amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.app }}

          push: true
          platforms: linux/amd64

          provenance: false

          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}/${{ matrix.app }}:amd64
            ghcr.io/${{ steps.repo.outputs.name }}/${{ matrix.app }}:amd64-${{ steps.vars.outputs.sha }}

          cache-from: type=gha,scope=${{ matrix.app }}-amd64
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}-amd64

  arm64:
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        app: [api, inference]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repo
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Short SHA
        id: vars
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push (arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.app }}

          push: true
          platforms: linux/arm64

          provenance: false

          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}/${{ matrix.app }}:arm64
            ghcr.io/${{ steps.repo.outputs.name }}/${{ matrix.app }}:arm64-${{ steps.vars.outputs.sha }}

          cache-from: type=gha,scope=${{ matrix.app }}-arm64
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}-arm64

  merge:
    runs-on: ubuntu-latest
    needs: [amd64, arm64]

    strategy:
      fail-fast: false
      matrix:
        app: [api, inference]

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repo
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Short SHA
        id: vars
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Tag name
        id: tag
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "tag=stable" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create multi-arch manifest (branch tag)
        run: |
          docker buildx imagetools create \
            -t ghcr.io/${{ steps.repo.outputs.name }}/${{ matrix.app }}:${{ steps.tag.outputs.tag }} \
            ghcr.io/${{ steps.repo.outputs.name }}/${{ matrix.app }}:amd64 \
            ghcr.io/${{ steps.repo.outputs.name }}/${{ matrix.app }}:arm64

      - name: Create multi-arch manifest (sha)
        run: |
          docker buildx imagetools create \
            -t ghcr.io/${{ steps.repo.outputs.name }}/${{ matrix.app }}:${{ steps.vars.outputs.sha }} \
            ghcr.io/${{ steps.repo.outputs.name }}/${{ matrix.app }}:amd64-${{ steps.vars.outputs.sha }} \
            ghcr.io/${{ steps.repo.outputs.name }}/${{ matrix.app }}:arm64-${{ steps.vars.outputs.sha }}
